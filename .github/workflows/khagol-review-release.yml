# Khagol review package pre-release, run from this public repo for free Actions minutes (owner, 13 Nov 2026).
# Same job as khagol-chronicles' review-release.yml, but the files are read from, and the PRE-release is created in,
# the PRIVATE repo aakashk9/khagol-chronicles (token KHAGOL_TOKEN), so unreleased review cuts never become public.
# Never posts to any social platform, never touches publishing/release.json, never creates RELEASE_READY.md.
# Input manifest: a sha256sum-format file, paths relative to the khagol-chronicles root; every file is verified with
# `sha256sum -c` before upload, and any mismatch fails the run with nothing published.
name: Khagol review package pre-release
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "sha256sum file in khagol-chronicles (e.g. content/episode-02-eclipses/renders/v8/REVIEW_PACKAGE_2026-11-06.sha256)"
        required: true
      tag:
        description: "Pre-release tag, e.g. review-ep02-20261106"
        required: true
      title:
        description: "Release title"
        required: true
      notes:
        description: "Path (khagol-chronicles root) of a Markdown notes file for the release body"
        required: true

permissions:
  contents: read

concurrency:
  group: khagol-review-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SRC: aakashk9/khagol-chronicles
    steps:
      - name: Check token and tag
        env:
          HAS_TOKEN: ${{ secrets.KHAGOL_TOKEN != '' }}
          TAG: ${{ inputs.tag }}
        run: |
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::KHAGOL_TOKEN secret missing"; exit 1; }
          case "$TAG" in review-*) ;; *) echo "::error::tag must start with review-"; exit 1;; esac

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC }}
          token: ${{ secrets.KHAGOL_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /.gitattributes
          sparse-checkout-cone-mode: false

      - name: Fetch only the manifest's files
        env:
          MANIFEST: ${{ inputs.manifest }}
          NOTES: ${{ inputs.notes }}
        run: |
          git sparse-checkout add "/$MANIFEST" "/$NOTES"
          test -f "$MANIFEST" && test -f "$NOTES"
          sed -E 's/^[0-9a-f]+  (\.\/)?/\//' "$MANIFEST" | xargs git sparse-checkout add

      - name: Verify every file against the manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          sha256sum -c --strict --quiet "$MANIFEST"
          echo "files: $(grep -c . "$MANIFEST")"

      - name: Stage assets with unique flat names
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          python3 - "$MANIFEST" "$RUNNER_TEMP/assets" <<'PY'
          import os, shutil, sys
          man, out = sys.argv[1], sys.argv[2]; seen = set()
          for line in open(man):
              if not line.strip(): continue
              h, p = line.rstrip("\n").split("  ", 1)
              if p.startswith("./"): p = p[2:]
              parts = p.split("/")
              name = "__".join(parts[2:] if parts[0] == "content" else parts)
              assert name not in seen, name; seen.add(name)
              assert os.path.getsize(p) < 2_000_000_000, p
              shutil.copy2(p, os.path.join(out, name))
          shutil.copy2(man, os.path.join(out, os.path.basename(man)))
          print(len(seen), "assets staged")
          PY

      - name: Create or refresh the pre-release in khagol-chronicles
        env:
          GH_TOKEN: ${{ secrets.KHAGOL_TOKEN }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          sha=$(git rev-parse HEAD)
          if gh release view "$TAG" --repo "$SRC" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/assets/* --clobber --repo "$SRC"
          else
            gh release create "$TAG" --repo "$SRC" --prerelease --target "$sha" --title "$TITLE" --notes-file "$NOTES" "$RUNNER_TEMP"/assets/*
          fi
          gh release view "$TAG" --repo "$SRC" --json url,isPrerelease,assets --jq '{isPrerelease, n_assets: (.assets|length)}'
