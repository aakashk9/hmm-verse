name: Publish Hmm.verse reels

# Hmm.verse reels are made in the private reel-engine repo and published from HERE, because GitHub Actions minutes
# are free for public repositories (owner, 12 Nov 2026). This file holds no secrets: the tokens live in this repo's
# encrypted Actions secrets, and the reels + publishing tools are read from reel-engine with REEL_ENGINE_TOKEN
# (fine-grained, contents read/write on reel-engine only; write = to record published.json).
#
# Every 15 minutes (and right after the reel run dispatches it) it looks for finished folders
# science/renders/hmmverse/YYYY-MM-DD_N_slug/ in reel-engine that have reel.mp4 + caption.md, no published.json and
# no skip file, dated within the last 4 days, and posts the OLDEST one to Instagram (+ Story + first comment), the
# Facebook Page and YouTube Shorts. Spacing (owner, 12 Nov 2026): one reel per run, and only when the last Hmm.verse
# Instagram post is at least HMMVERSE_MIN_GAP_MIN minutes old (repo variable, default 120), so a backlog goes out
# 2 hours apart instead of all at once. A manual run with a folder ignores the gap. published.json / fb_published.json / yt_published.json are committed back to reel-engine, so a
# folder is never posted twice. Master switch: repo variable HMMVERSE_AUTOPUBLISH = "on".
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      folder:
        description: "Optional: one folder, e.g. science/renders/hmmverse/2026-11-12_1_some_slug (empty = all pending)"
        required: false
        default: ""
      dry_run:
        description: "Only check files, caption and tokens; do not post"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hmmverse-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SRC: aakashk9/reel-engine
    steps:
      - name: Check switch and token
        id: gate
        env:
          AUTOPUBLISH: ${{ vars.HMMVERSE_AUTOPUBLISH }}
          HAS_TOKEN: ${{ secrets.REEL_ENGINE_TOKEN != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then echo "REEL_ENGINE_TOKEN secret missing - nothing to do."; echo "go=" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$AUTOPUBLISH" != "on" ]; then echo "HMMVERSE_AUTOPUBLISH is not 'on'."; echo "go=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=1" >> "$GITHUB_OUTPUT"

      # History without file contents + only tools/ checked out: the reel-engine repo is >1 GB of videos.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go
        with:
          repository: ${{ env.SRC }}
          token: ${{ secrets.REEL_ENGINE_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools

      - name: Find reels to publish
        id: pick
        if: steps.gate.outputs.go
        env:
          INPUT_FOLDER: ${{ inputs.folder }}
          MIN_GAP: ${{ vars.HMMVERSE_MIN_GAP_MIN || '120' }}
        run: |
          if [ -n "$INPUT_FOLDER" ]; then
            folders="${INPUT_FOLDER%/}"
          else
            since=$(TZ=Asia/Kolkata date -d '4 days ago' +%Y-%m-%d)
            files=$(git ls-tree -r --name-only HEAD science/renders/hmmverse/)
            # gap: newest published_at among the latest published folders (blobs are fetched on demand)
            last=0
            for pj in $(echo "$files" | grep -E '/published\.json$' | sort | tail -n 8); do
              ts=$(git show "HEAD:$pj" | python3 -c "import json,sys,datetime;d=json.load(sys.stdin).get('published_at','');print(int(datetime.datetime.fromisoformat(d).timestamp()) if d else 0)" 2>/dev/null || echo 0)
              [ "${ts:-0}" -gt "$last" ] && last=$ts
            done
            gap=$(( ($(date +%s) - last) / 60 ))
            echo "Last Hmm.verse Instagram post: ${gap} min ago (minimum gap ${MIN_GAP} min)" | tee -a "$GITHUB_STEP_SUMMARY"
            folders=""
            if [ "$gap" -ge "$MIN_GAP" ]; then
              for d in $(echo "$files" | grep -E '^science/renders/hmmverse/20[0-9]{2}-[0-9]{2}-[0-9]{2}_[0-9]+_[^/]+/reel\.mp4$' | xargs -r -n1 dirname | sort -u); do
                day=$(basename "$d" | cut -c1-10)
                [[ "$day" < "$since" ]] && continue
                echo "$files" | grep -qx "$d/caption.md" || continue
                echo "$files" | grep -qx "$d/published.json" && continue
                echo "$files" | grep -qx "$d/skip" && continue
                folders="$d"; break        # oldest pending folder only
              done
            fi
          fi
          folders=$(echo $folders)
          echo "Reels selected: ${folders:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "folders=$folders" >> "$GITHUB_OUTPUT"
          if [ -n "$folders" ]; then git sparse-checkout add $folders; fi

      - name: Install ffmpeg (only if a Story copy must be trimmed)
        if: steps.pick.outputs.folders != ''
        run: |
          need=$(python3 - ${{ steps.pick.outputs.folders }} <<'PY'
          import os, struct, sys
          def dur(p):
              b = open(p, "rb").read(); i = b.find(b"mvhd")
              if i < 0: return 999
              v = b[i + 4]
              ts, d = (struct.unpack(">IQ", b[i + 24:i + 36]) if v == 1 else struct.unpack(">II", b[i + 16:i + 24]))
              return d / ts
          print(any(dur(os.path.join(f, "reel.mp4")) > 59.5 for f in sys.argv[1:] if os.path.exists(os.path.join(f, "reel.mp4"))))
          PY
          )
          echo "Story copy needs trimming: $need"
          if [ "$need" = "True" ]; then which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg); fi

      - name: Publish to Instagram
        if: steps.pick.outputs.folders != ''
        env:
          IG_ACCESS_TOKEN: ${{ secrets.HMMVERSE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.HMMVERSE_USER_ID }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v23.0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          IG_FIRST_COMMENT: ${{ vars.HMMVERSE_FIRST_COMMENT || 'Follow for daily hmm moments! 🤔' }}
          IG_STORY: ${{ vars.HMMVERSE_STORY || 'on' }}
          PYTHONUNBUFFERED: "1"
          IG_DEADLINE_MIN: "40"
        run: python3 tools/ig_publish.py ${{ steps.pick.outputs.folders }} 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Publish to Facebook Page
        if: always() && steps.pick.outputs.folders != ''
        env:
          FB_ACCESS_TOKEN: ${{ secrets.HMMVERSE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.HMMVERSE_FB_PAGE_ID }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v23.0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 tools/fb_publish.py ${{ steps.pick.outputs.folders }} 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Upload to YouTube Shorts
        if: always() && steps.pick.outputs.folders != ''
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_AUTOPUBLISH: ${{ vars.YT_AUTOPUBLISH }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          YT_FIRST_COMMENT: ${{ vars.HMMVERSE_FIRST_COMMENT || 'Follow for daily hmm moments! 🤔' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          if [ "$YT_AUTOPUBLISH" != "on" ]; then echo "YT_AUTOPUBLISH is not 'on' - not uploading to YouTube."; exit 0; fi
          python3 tools/yt_publish.py ${{ steps.pick.outputs.folders }} 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Record published reels in reel-engine
        if: always() && steps.pick.outputs.folders != ''
        run: |
          git config user.name "hmm.verse publisher"
          git config user.email "noreply@github.com"
          for f in ${{ steps.pick.outputs.folders }}; do
            for j in published.json fb_published.json yt_published.json; do [ -f "$f/$j" ] && git add -f "$f/$j"; done
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record Hmm.verse publish [skip ci]"
            for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          fi

