name: Publish Khagol episode (YouTube, Instagram, Facebook)

# Feed C. Khagol Chronicles episodes are made in the private repo aakashk9/khagol-chronicles and published from HERE,
# because GitHub Actions minutes are free for public repositories (owner, 13 Nov 2026; Khagol's own runs were refused
# from 12 Nov for the private-minutes spending limit). This file holds no secrets. Secrets in this repo:
# REEL_ENGINE_TOKEN (also has khagol-chronicles access: Contents read/write to record publishing/published/*.json),
# C_ACCESS_TOKEN, C_USER_ID, C_FB_PAGE_ID, C_YT_CLIENT_ID, C_YT_CLIENT_SECRET, C_YT_REFRESH_TOKEN.
# Variables: C_AUTOPUBLISH = "on" (master switch for scheduled runs); optional C_YT_PRIVACY, C_CHANNEL_URL,
# C_INSTAGRAM_URL, C_FACEBOOK_URL.
#
# Every 3 hours (or a repository_dispatch "khagol-release" sent right after a signoff) it looks for episodes in
# khagol-chronicles whose production/reviews/RELEASE_READY.md was added within the last 7 days, that have
# publishing/release.json, no publishing/skip, and at least one platform step without its publishing/published/<step>.json.
# Each scheduled attempt is counted in publishing/published/auto_attempts.json; after 3 attempts an episode waits for a
# manual run. Steps already posted are never re-run, so a retry only redoes what failed (e.g. Instagram).
# Order: tools/khagol_release.py posts documentary (YouTube) -> Short (YouTube) -> Reel (Instagram) -> Reel (Facebook).
# Manual runs default to dry_run.
on:
  schedule:
    - cron: "4 */3 * * *"
  repository_dispatch:
    types: [khagol-release]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder, e.g. content/episode-02-eclipses (or --check-account)"
        required: true
      steps:
        description: "Steps to run: all, a comma list of documentary,short,instagram,facebook, or playlists (repair)"
        default: "all"
      dry_run:
        description: "Only check manifest, files, captions and accounts; do not post"
        type: boolean
        default: true
      ig_containers:
        description: "Optional: Instagram container ids left processing by an earlier run (use with steps=instagram)"
        default: ""
      meta_encode:
        description: "Instagram/Facebook encode: lite (default; CRF 28, max 1 Mbit/s) or standard (CRF 21)"
        default: "lite"

permissions:
  contents: write     # only for the temporary "ig-host" pre-release (Instagram URL uploads); files are deleted after each run

concurrency:
  group: khagol-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SRC: aakashk9/khagol-chronicles
      PYTHONUNBUFFERED: "1"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
      # Meta (one system-user token for the Instagram account and the Facebook Page)
      IG_ACCESS_TOKEN: ${{ secrets.C_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.C_USER_ID }}
      FB_ACCESS_TOKEN: ${{ secrets.C_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.C_FB_PAGE_ID }}
      IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v23.0' }}
      # Instagram failures: same handling as Hmm.verse / curious.janta (tools/ig_publish.py from reel-engine, 12 Nov):
      # up to 5 fresh containers per run, each retry a freshly re-encoded copy, earlier containers keep being watched and
      # the first to finish is published (only one ever is). 3 scheduled runs, 3 hours apart, before it waits for a manual run.
      IG_DEADLINE_MIN: "60"
      IG_UPLOAD_TRIES: "5"
      IG_RETRY_WAIT: "45"
      # 13 Nov 2026: Instagram's rupload never received a Khagol file (EP01, EP02: 0 bytes, 10/10 failures), so
      # Instagram downloads the video from a URL instead: a temporary asset of this repo's "ig-host" pre-release.
      IG_UPLOAD_MODE: ${{ vars.C_IG_UPLOAD_MODE || 'url' }}
      IG_HOST_REPO: ${{ github.repository }}
      IG_HOST_GH_TOKEN: ${{ github.token }}
      # YouTube (Khagol channel's own Google Cloud project)
      YT_CLIENT_ID: ${{ secrets.C_YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.C_YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.C_YT_REFRESH_TOKEN }}
      YT_PRIVACY: ${{ vars.C_YT_PRIVACY || 'public' }}
      KHAGOL_CHANNEL_URL: ${{ vars.C_CHANNEL_URL || 'https://www.youtube.com/@KhagolChronicles' }}
      KHAGOL_INSTAGRAM_URL: ${{ vars.C_INSTAGRAM_URL }}
      KHAGOL_FACEBOOK_URL: ${{ vars.C_FACEBOOK_URL }}
    steps:
      - name: Check switch and token
        id: gate
        env:
          AUTOPUBLISH: ${{ vars.C_AUTOPUBLISH }}
          HAS_TOKEN: ${{ secrets.REEL_ENGINE_TOKEN != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then echo "REEL_ENGINE_TOKEN secret missing - nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"; echo "go=" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$AUTOPUBLISH" != "on" ]; then echo "C_AUTOPUBLISH is not 'on'." | tee -a "$GITHUB_STEP_SUMMARY"; echo "go=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=1" >> "$GITHUB_OUTPUT"

      # History without file contents + only the small folders: khagol-chronicles holds GBs of renders.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go
        with:
          repository: ${{ env.SRC }}
          token: ${{ secrets.REEL_ENGINE_TOKEN }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            tools
            production/templates
          sparse-checkout-cone-mode: false

      - name: Find the released episode
        id: pick
        if: steps.gate.outputs.go
        env:
          EVENT: ${{ github.event_name }}
          INPUT_EPISODE: ${{ inputs.episode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            eps="${INPUT_EPISODE%/}"
          else
            eps=$(python3 - <<'PY'
          import json, subprocess, time
          def git(*a): return subprocess.run(["git", *a], capture_output=True, text=True).stdout
          files = set(git("ls-tree", "-r", "--name-only", "HEAD", "content/").split())
          now, out = time.time(), []
          for rr in sorted(f for f in files if f.endswith("/production/reviews/RELEASE_READY.md")):
              ep = rr[: -len("/production/reviews/RELEASE_READY.md")]
              pub = ep + "/publishing/"
              if pub + "skip" in files or pub + "release.json" not in files:
                  continue
              added = git("log", "--diff-filter=A", "-1", "--format=%ct", "--", rr).strip()
              if not added or now - int(added) > 7 * 86400:
                  continue                      # old signoffs never auto-publish (same as "newly added" before)
              m = json.loads(git("show", "HEAD:" + pub + "release.json"))
              todo = [s for s in ("documentary", "short", "instagram", "facebook")
                      if m.get(s) and pub + "published/" + s + ".json" not in files]
              if not todo:
                  continue
              tries = 0
              if pub + "published/auto_attempts.json" in files:
                  tries = json.loads(git("show", "HEAD:" + pub + "published/auto_attempts.json")).get("attempts", 0)
              if tries >= 3:
                  print(f"{ep}: {','.join(todo)} still pending after {tries} automatic attempts - run it manually.",
                        file=__import__('sys').stderr)
                  continue
              out.append(ep)
          print(" ".join(out))
          PY
            )
          fi
          echo "Episodes selected: ${eps:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "episodes=$eps" >> "$GITHUB_OUTPUT"

      - name: Fetch only the files the release needs
        if: steps.pick.outputs.episodes != '' && !startsWith(steps.pick.outputs.episodes, '--')
        env:
          EPISODES: ${{ steps.pick.outputs.episodes }}
        run: |
          for ep in $EPISODES; do
            git sparse-checkout add "/$ep/publishing/" "/$ep/production/reviews/"
            [ -f "$ep/production/reviews/RELEASE_READY.md" ] || { echo "::error::$ep lacks RELEASE_READY.md; publication blocked (including manual runs)."; exit 1; }
            [ -f "$ep/publishing/release.json" ] || { echo "::error::$ep/publishing/release.json missing"; exit 1; }
            python3 - "$ep" > /tmp/need.txt <<'PY'
          import json, os, sys
          ep = sys.argv[1]; m = json.load(open(os.path.join(ep, "publishing", "release.json")))
          for step in ("documentary", "short", "instagram", "facebook"):
              c = m.get(step) or {}
              for k in ("video", "thumbnail", "srt"):
                  p = c.get(k)
                  if p:
                      print("/" + (p if p.startswith(("content/", "brand/")) else os.path.normpath(os.path.join(ep, p))))
          PY
            cat /tmp/need.txt
            xargs -a /tmp/need.txt git sparse-checkout add
          done
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi

      - name: Check accounts (no posting)
        if: steps.pick.outputs.episodes == '--check-account'
        run: |
          python3 tools/yt_publish.py --check-account
          python3 tools/ig_publish.py --check-account
          python3 tools/fb_publish.py --check-account

      - name: Publish
        if: steps.pick.outputs.episodes != '' && !startsWith(steps.pick.outputs.episodes, '--')
        env:
          EPISODES: ${{ steps.pick.outputs.episodes }}
          STEPS: ${{ inputs.steps || 'all' }}
          IG_CONTAINERS: ${{ inputs.ig_containers }}
          META_ENCODE: ${{ inputs.meta_encode || 'lite' }}
        run: |
          rc=0
          only=""; [ "$STEPS" != "all" ] && only="--only=$STEPS"
          for ep in $EPISODES; do
            python3 tools/khagol_release.py "$ep" $only 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            [ "${PIPESTATUS[0]}" = "0" ] || rc=1
          done
          exit $rc
        shell: bash

      - name: Record what was published (in khagol-chronicles) and open the manual-steps issue there
        if: always() && steps.pick.outputs.episodes != '' && !startsWith(steps.pick.outputs.episodes, '--')
        env:
          GH_TOKEN: ${{ secrets.REEL_ENGINE_TOKEN }}
          EPISODES: ${{ steps.pick.outputs.episodes }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "khagol publisher"
          git config user.email "noreply@github.com"
          new_steps=""
          for ep in $EPISODES; do
            if [ "$EVENT" != "workflow_dispatch" ]; then
              mkdir -p "$ep/publishing/published"
              python3 - "$ep/publishing/published/auto_attempts.json" <<'PY'
          import json, os, sys, datetime
          p = sys.argv[1]; d = json.load(open(p)) if os.path.exists(p) else {"attempts": 0, "runs": []}
          d["attempts"] += 1
          d["runs"].append({"at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"), "run": os.environ["RUN_URL"]})
          json.dump(d, open(p, "w"), indent=2)
          PY
            fi
            git add -f "$ep/publishing/published/"*.json 2>/dev/null || true
            if [ -f "$ep/publishing/published/MANUAL_STEPS.md" ] && ! git ls-files --error-unmatch "$ep/publishing/published/MANUAL_STEPS.md" >/dev/null 2>&1; then
              git add -f "$ep/publishing/published/MANUAL_STEPS.md"; new_steps="$new_steps $ep"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record Khagol publish: $EPISODES (from hmm-verse Actions) [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          fi
          for ep in $new_steps; do
            title=$(head -1 "$ep/publishing/published/MANUAL_STEPS.md" | sed 's/^# //')
            gh issue create --repo "$SRC" --title "$title" --body-file "$ep/publishing/published/MANUAL_STEPS.md" || \
              echo "::warning::could not open the manual-steps issue for $ep"
          done
